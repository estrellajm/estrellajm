<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 230" width="1000" height="230" role="img" aria-label="Jose Estrella — I ship the feature, then build the primitive underneath it.">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5eead4"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#1c2530" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1000" height="230" fill="#0d1117"/>
  <rect width="1000" height="230" fill="url(#grid)" opacity="0.6"/>
  <rect x="0" y="0" width="4" height="230" fill="url(#accent)"/>

  <text x="56" y="88" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="42" fill="#e6edf3" letter-spacing="1">Jose Estrella</text>
  <text x="57" y="126" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" fill="#8b949e">I ship the feature — then build the primitive underneath it.</text>
  <text x="57" y="170" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#5eead4" letter-spacing="2">TYPESCRIPT · PYTHON · C++ · REACT · NODE · GCP</text>

  <!-- gateway motif: many clients → one gateway → many upstreams -->
  <g transform="translate(742, 60)" fill="none" stroke-width="1.5">
    <path d="M20 20 C 70 20, 70 55, 118 55" stroke="#30363d"/>
    <path d="M20 55 C 70 55, 70 55, 118 55" stroke="#30363d"/>
    <path d="M20 90 C 70 90, 70 55, 118 55" stroke="#30363d"/>
    <path d="M140 55 C 188 55, 188 20, 236 20" stroke="#30363d"/>
    <path d="M140 55 C 188 55, 188 55, 236 55" stroke="#30363d"/>
    <path d="M140 55 C 188 55, 188 90, 236 90" stroke="#30363d"/>

    <circle cx="16" cy="20" r="5" fill="#484f58" stroke="none"/>
    <circle cx="16" cy="55" r="5" fill="#484f58" stroke="none"/>
    <circle cx="16" cy="90" r="5" fill="#484f58" stroke="none"/>

    <rect x="118" y="41" width="22" height="28" rx="4" fill="#0d1117" stroke="url(#accent)" stroke-width="2"/>

    <circle cx="240" cy="20" r="5" fill="#5eead4" stroke="none"/>
    <circle cx="240" cy="55" r="5" fill="#38bdf8" stroke="none"/>
    <circle cx="240" cy="90" r="5" fill="#5eead4" stroke="none"/>
  </g>
</svg>
