<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 230" width="1000" height="230" role="img" aria-label="Jose Estrella — I ship the feature, then build the primitive underneath it.">
  <defs>
    <linearGradient id="accentL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <pattern id="gridL" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#e6eaef" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1000" height="230" fill="#ffffff"/>
  <rect width="1000" height="230" fill="url(#gridL)" opacity="0.9"/>
  <rect x="0" y="0" width="4" height="230" fill="url(#accentL)"/>

  <text x="56" y="88" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="42" fill="#111827" letter-spacing="1">Jose Estrella</text>
  <text x="57" y="126" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" fill="#57606a">I ship the feature — then build the primitive underneath it.</text>
  <text x="57" y="170" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#0f766e" letter-spacing="2">TYPESCRIPT · PYTHON · C++ · REACT · NODE · GCP</text>

  <!-- gateway motif: many clients → one gateway → many upstreams -->
  <g transform="translate(742, 60)" fill="none" stroke-width="1.5">
    <path d="M20 20 C 70 20, 70 55, 118 55" stroke="#d0d7de"/>
    <path d="M20 55 C 70 55, 70 55, 118 55" stroke="#d0d7de"/>
    <path d="M20 90 C 70 90, 70 55, 118 55" stroke="#d0d7de"/>
    <path d="M140 55 C 188 55, 188 20, 236 20" stroke="#d0d7de"/>
    <path d="M140 55 C 188 55, 188 55, 236 55" stroke="#d0d7de"/>
    <path d="M140 55 C 188 55, 188 90, 236 90" stroke="#d0d7de"/>

    <circle cx="16" cy="20" r="5" fill="#afb8c1" stroke="none"/>
    <circle cx="16" cy="55" r="5" fill="#afb8c1" stroke="none"/>
    <circle cx="16" cy="90" r="5" fill="#afb8c1" stroke="none"/>

    <rect x="118" y="41" width="22" height="28" rx="4" fill="#ffffff" stroke="url(#accentL)" stroke-width="2"/>

    <circle cx="240" cy="20" r="5" fill="#0f766e" stroke="none"/>
    <circle cx="240" cy="55" r="5" fill="#0369a1" stroke="none"/>
    <circle cx="240" cy="90" r="5" fill="#0f766e" stroke="none"/>
  </g>
</svg>
